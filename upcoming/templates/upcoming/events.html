{% extends 'cms/barely' %}
{% block content %}
<h2 class="loose right">Join us for a special event</h2>
<div class="invite">
	<div class="info">
		{% part 'event info' %}

		<a class="action button right float-right" href="{% url 'rsvp:signin' date=event.date_str %}">RSVP 4 Swag</a>
		}
		
	</div>
	<div class="flyer">
		<img src="{{ event.flyer.desktop_url }}">
	</div>
</div>

{% endblock %}
